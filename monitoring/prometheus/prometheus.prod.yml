# Local stack + production. Opt in while demoing (docs/09-monitoring.md):
#   PROMETHEUS_CONFIG=prometheus.prod.yml docker compose --profile monitoring --profile production up -d
#
# Needs two gitignored inputs:
#   monitoring/prometheus/prod-token   the API's METRICS_TOKEN (a Container Apps secret)
#   PROD_DATABASE_URL in .env          Neon connection string for postgres-exporter-prod
# NB: scraping keeps the scale-to-zero API (and Neon's compute) awake, so it is billed as active time.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # --- local docker compose stack ---------------------------------------
  - job_name: blogflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          env: local

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- production -------------------------------------------------------
  # the live API over HTTPS; /metrics requires the bearer token
  - job_name: blogflow-api-prod
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    authorization:
      credentials_file: /etc/prometheus/prod-token
    static_configs:
      - targets: ["blogflow-api.jollymeadow-32aadaf0.southeastasia.azurecontainerapps.io"]
        labels:
          env: production

  # Neon Postgres, through a second exporter that runs locally
  - job_name: postgres-prod
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter-prod:9187"]
        labels:
          env: production
