global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: blogflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          env: local

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- production (Azure Container Apps) ----------------------------------
  # 1. the API's METRICS_TOKEN is a Container Apps secret:
  #      az containerapp secret show -n blogflow-api -g blogflow-rg --secret-name metrics-token --query value -o tsv
  # 2. write it to monitoring/prometheus/prod-token (gitignored)
  # 3. uncomment, then: curl -X POST localhost:9090/-/reload
  # NB: scraping keeps the scale-to-zero API awake (billed as active time) - enable while demoing.
  #
  # - job_name: blogflow-api-prod
  #   scheme: https
  #   metrics_path: /metrics
  #   authorization:
  #     credentials_file: /etc/prometheus/prod-token
  #   static_configs:
  #     - targets: ["blogflow-api.jollymeadow-32aadaf0.southeastasia.azurecontainerapps.io"]
  #       labels:
  #         env: production
