name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------ test
  backend-test:
    name: Backend · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blogflow
          POSTGRES_PASSWORD: blogflow
          POSTGRES_DB: blogflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blogflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://blogflow:blogflow@localhost:5432/blogflow_test
      JWT_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Run migrations
        run: npm run migrate
      - name: Unit + integration tests
        run: npm test -- --coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend-test:
    name: Frontend · lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ----------------------------------------------------------------- build
  docker:
    name: Docker · ${{ matrix.service }}
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: blogflow-api
            target: runtime
          - service: frontend
            image: blogflow-web
            target: runtime
    # PRs build to prove the Dockerfile works; only pushes to main/develop publish images
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # early start on the "security scanning" offline milestone — reports, doesn't block yet
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (third-party → pinned to commit)
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy · Azure Container Apps (production)
    needs: docker
    # skipped until the production URLs are configured as repository variables (see docs/07-cicd.md)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.API_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token → Azure managed identity (no stored password)
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'blogflow-rg' }}
    steps:
      - name: Resolve image tags
        id: img
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          echo "api=${{ env.REGISTRY }}/$OWNER/blogflow-api:sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/$OWNER/blogflow-web:sha-$SHA" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # roll each app to the exact immutable sha-<commit> image built above
      - name: Deploy API
        run: az containerapp update -n blogflow-api -g "$RESOURCE_GROUP" --image '${{ steps.img.outputs.api }}' -o none

      - name: Wait for API to report the new version
        run: |
          for i in $(seq 1 40); do
            v=$(curl -fsS --max-time 60 "${{ vars.API_URL }}/health" | jq -r '.version // empty' || true)
            echo "attempt $i: version=$v"
            [ "$v" = "sha-${{ github.sha }}" ] && exit 0
            sleep 15
          done
          echo "::error::API did not become healthy on the new version" && exit 1

      - name: Deploy frontend
        run: az containerapp update -n blogflow-web -g "$RESOURCE_GROUP" --image '${{ steps.img.outputs.web }}' -o none

      - name: Smoke test production
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "${{ vars.FRONTEND_URL }}/healthz" >/dev/null \
               && curl -fsS "${{ vars.FRONTEND_URL }}/api/health" | jq -e '.status == "healthy"' \
               && curl -fsS "${{ vars.FRONTEND_URL }}/api/posts?limit=1" | jq -e '.success == true' >/dev/null; then
              echo "✅ production is healthy"; exit 0
            fi
            sleep 15
          done
          echo "::error::Smoke test failed" && exit 1
