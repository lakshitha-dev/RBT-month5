global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: blogflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          env: local

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- production (Render) ------------------------------------------------
  # 1. set METRICS_TOKEN on the blogflow-api service in Render
  # 2. write the same token to monitoring/prometheus/prod-token (gitignored)
  # 3. uncomment, set your API host, then: curl -X POST localhost:9090/-/reload
  #
  # - job_name: blogflow-api-prod
  #   scheme: https
  #   metrics_path: /metrics
  #   authorization:
  #     credentials_file: /etc/prometheus/prod-token
  #   static_configs:
  #     - targets: ["blogflow-api.onrender.com"]
  #       labels:
  #         env: production
