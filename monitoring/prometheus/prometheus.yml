global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: blogflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          env: local

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Production (Azure Container Apps + Neon) is scraped by prometheus.prod.yml, which adds two jobs
# to these. See docs/09-monitoring.md → "Monitoring production".
